<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strava Test</title>
  <style>
    body { font-family: monospace; background: #0a0a0a; color: #e0e0e0; padding: 24px; max-width: 600px; margin: 0 auto; }
    h2 { color: #fc4c02; letter-spacing: .1em; }
    button { background: #fc4c02; color: #fff; border: none; padding: 12px 24px; font-size: 14px; cursor: pointer; margin: 8px 0; display: block; }
    pre { background: #1a1a1a; padding: 16px; overflow: auto; font-size: 12px; border: 1px solid #333; }
    .ok { color: #34d399; } .err { color: #f87171; } .dim { color: #666; }
    input { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px 12px; width: 100%; box-sizing: border-box; margin: 4px 0 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h2>STRAVA TEST</h2>
  <p class="dim">Isolierte Testumgebung — unabhängig von der App</p>

  <hr style="border-color:#222;margin:16px 0">

  <div id="status"></div>

  <!-- Step 1: Supabase Login -->
  <div id="step1">
    <h3>1. Supabase Login</h3>
    <input id="email" type="email" placeholder="E-Mail" />
    <input id="pw" type="password" placeholder="Passwort" />
    <button onclick="sbLogin()">EINLOGGEN</button>
    <pre id="sb-result" class="dim">— noch nicht eingeloggt —</pre>
  </div>

  <!-- Step 2: Strava Connect -->
  <div id="step2" style="display:none">
    <h3>2. Strava verbinden</h3>
    <pre id="sb-user"></pre>
    <button onclick="stravaConnect()">MIT STRAVA VERBINDEN →</button>
  </div>

  <!-- Step 3: Load Activities -->
  <div id="step3" style="display:none">
    <h3>3. Aktivitäten laden</h3>
    <button onclick="loadActivities()">AKTIVITÄTEN LADEN</button>
    <pre id="activities-result">—</pre>
  </div>

  <script>
    const SUPABASE_URL = 'https://fklzwfhtqgsrgaspqncg.supabase.co'
    const SUPABASE_KEY = (() => {
      // anon key aus der Haupt-App lesen — oder hier direkt eintragen
      // Öffne index.html und suche nach 'eyJ' um den anon key zu finden
      return localStorage.getItem('sm_sb_anon') || prompt('Supabase Anon Key (aus index.html):') || ''
    })()

    const CALLBACK_URL = `${SUPABASE_URL}/functions/v1/strava-callback`
    const STRAVA_CLIENT_ID = '251223'

    let session = null

    // Check for ?strava= redirect from callback
    const params = new URLSearchParams(location.search)
    if (params.get('strava') === 'connected') {
      document.getElementById('status').innerHTML = '<p class="ok">✓ Strava verbunden!</p>'
      history.replaceState({}, '', location.pathname)
    } else if (params.get('strava') === 'error') {
      document.getElementById('status').innerHTML = `<p class="err">✗ Fehler: ${params.get('msg') || 'unbekannt'}</p>`
    }

    async function sbLogin() {
      const email = document.getElementById('email').value
      const pw    = document.getElementById('pw').value
      const res   = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pw })
      })
      const data = await res.json()
      if (data.access_token) {
        session = data
        localStorage.setItem('sm_sb_anon', SUPABASE_KEY)
        document.getElementById('sb-result').innerHTML = `<span class="ok">✓ Eingeloggt als ${data.user?.email}</span>`
        document.getElementById('sb-user').textContent = `user_id: ${data.user?.id}`
        document.getElementById('step1').style.display = 'none'
        document.getElementById('step2').style.display = 'block'
        checkStravaConnected()
      } else {
        document.getElementById('sb-result').innerHTML = `<span class="err">✗ ${data.error_description || data.msg || JSON.stringify(data)}</span>`
      }
    }

    async function checkStravaConnected() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?user_id=eq.${session.user.id}&select=data`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${session.access_token}` }
      })
      const rows = await res.json()
      if (rows[0]?.data?.strava) {
        document.getElementById('step2').style.display = 'block'
        document.getElementById('step3').style.display = 'block'
        document.getElementById('sb-user').textContent += `\nStrava: ${rows[0].data.strava.athlete_name} (ID: ${rows[0].data.strava.athlete_id})`
      }
    }

    function stravaConnect() {
      if (!session) return alert('Erst einloggen!')
      const authUrl = new URL('https://www.strava.com/oauth/authorize')
      authUrl.searchParams.set('client_id',     STRAVA_CLIENT_ID)
      authUrl.searchParams.set('redirect_uri',  CALLBACK_URL)
      authUrl.searchParams.set('response_type', 'code')
      authUrl.searchParams.set('approval_prompt','auto')
      authUrl.searchParams.set('scope',         'activity:read_all')
      authUrl.searchParams.set('state',         session.user.id)
      location.href = authUrl.toString()
    }

    async function loadActivities() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?user_id=eq.${session.user.id}&select=data`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${session.access_token}` }
      })
      const rows = await res.json()
      const strava = rows[0]?.data?.strava
      if (!strava) { document.getElementById('activities-result').textContent = 'Kein Strava-Token gespeichert.'; return }

      const actRes = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=10', {
        headers: { 'Authorization': `Bearer ${strava.access_token}` }
      })
      const acts = await actRes.json()
      if (!Array.isArray(acts)) {
        document.getElementById('activities-result').textContent = JSON.stringify(acts, null, 2)
        return
      }
      document.getElementById('activities-result').textContent = acts.map(a =>
        `${a.start_date_local.slice(0,10)}  ${a.type.padEnd(12)}  ${a.name}`
      ).join('\n')
      document.getElementById('step3').style.display = 'block'
    }
  </script>
</body>
</html>
