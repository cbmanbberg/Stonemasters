<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Return to Climb"/>
  <meta name="theme-color" content="#FDF6EF"/>
  <title>Return to Climb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      background: #FDF6EF;
      min-height: 100%;
      min-height: 100dvh;
      font-family: 'Nunito', sans-serif;
      color: #3D2E26;
      -webkit-font-smoothing: antialiased;
    }
    #fallback {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #FDF6EF;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Nunito', sans-serif;
      color: #A8937F;
      font-size: 14px;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="fallback">Lädt…</div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        var r = document.getElementById("root");
        var f = document.getElementById("fallback");
        if (r && r.children.length > 0 && f) f.remove();
        else if (f) f.textContent = "Fehler beim Laden — bitte neu laden";
      }, 3000);
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
