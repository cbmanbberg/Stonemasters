eicht gehockt, Rücken gerade.`,move:`Aus der Hüfte explosiv strecken, KB schwingt bis Schulterhöhe. Zurückschwingen.`,cue:`Kein Squat — Hüftbewegung! Arme sind passiv. Power kommt aus Hüfte und Gesäß.`},kbclean:{start:`KB vor den Füßen, ähnlich wie Swing-Start.`,move:`KB explosiv aus der Hüfte hoch führen, in die Rack-Position auf der Schulter drehen.`,cue:`KB dreht um den Unterarm — nicht gegen das Handgelenk schlagen. Weicher Fang.`},hollowbody:{start:`Rückenlage, Arme über dem Kopf gestreckt, Beine gestreckt.`,move:`Lendenwirbel flach auf den Boden pressen. Schultern und Beine leicht abheben. Halten.`,cue:`Kein Hohlkreuz! Rücken muss den Boden berühren.`},lsit:{start:`An Dipstangen oder auf dem Boden, Arme gestreckt.`,move:`Beine gestreckt horizontal halten. So lange wie möglich.`,cue:`Progression: erst Beine angewinkelt, dann gestreckt. Hüfte kippen, nicht hängen lassen.`},deadbug:{start:`Rückenlage, Arme senkrecht nach oben, Beine 90° in der Luft.`,move:`Diagonal: rechter Arm und linkes Bein gleichzeitig strecken und absenken. Wechseln.`,cue:`Rücken bleibt flach am Boden! Langsam und kontrolliert.`},plank:{start:`Unterarmstütz oder gestreckter Arm, Körper gerade.`,move:`Position halten. Variation: Seitstütz links/rechts wechseln.`,cue:`Hüfte weder durchhängen noch hochziehen. Gleichmäßig atmen.`},kbwindmill:{start:`Stehend, KB über dem Kopf in einer Hand, Füße breiter als Schultern.`,move:`Oberkörper seitlich nach unten neigen, freie Hand gleitet das Bein entlang, Blick auf KB.`,cue:`Langsam und kontrolliert. Hüfte drückt zur Seite.`},hang20:{start:`Lifting Edge (20mm Leiste) am Boden. Gewichtsscheiben oder Bodyweight. Stehend, 4-Finger Half-Crimp an der Leiste.`,move:`Leiste mit Fingern greifen und Gewicht abheben. Für Repeater: abheben — halten — ablegen — kurz Pause — wiederholen.`,cue:`TRAINING: Bodyweight oder leichtes Zusatzgewicht. Repeater-Format: 6× abheben / 3 Sek Pause. Qualität vor Gewicht. NIE bei Schmerzen.`},hang20_rep:{start:`Lifting Edge (20mm Leiste) am Boden. Bodyweight oder leichtes Zusatzgewicht. Stehend, 4-Finger Half-Crimp.`,move:`Gewicht abheben und halten — Intervall-Format: 7 Sek halten / 3 Sek ablegen. 6 Wiederholungen = 1 Satz. 3 Min Pause zwischen Sätzen.`,cue:`Kraft-Ausdauer nach Eva López. Ca. 60–70% der Maximallast. Konstantes Tempo wichtiger als Gewicht. Bei Müdigkeit sofort abbrechen — Sehnen-Schutz.`},scap_pull:{start:`An der Klimmzugstange hängen, Arme vollständig gestreckt. Schultern entspannt.`,move:`Nur Schulterblätter zusammenziehen und nach unten drücken — Arme bleiben gestreckt. Kurz halten. Lösen.`,cue:`Aktiviert Schulterblatt-Depressoren und Serratus anterior. Diese Muskeln stabilisieren den Schulter-Komplex beim Hängen und schützen das Schultergelenk. Pflicht vor jedem Fingertraining und Zugtraining.`},w1:{start:`Aufrecht stehen, Arme locker.`,move:`Große Kreise mit den Armen, beide Richtungen.`,cue:`Nur Aufwärmen. Langsam, ohne Kraft.`},w2:{start:`An der Klimmzugstange hängen, Arme gestreckt.`,move:`Nur Schulterblätter bewegen — zusammenziehen und nach unten drücken.`,cue:`Kleine Bewegung. Schultern stabilisieren.`},w3:{start:`KB mit beiden Händen vor der Brust halten.`,move:`Tief in die Knie, Ellbogen innen gegen die Knie. Langsam wieder hoch.`,cue:`Warm-up, kein Training. Langsam und tief.`},w4:{start:`An der Klimmzugstange hängen, Arme gestreckt. Griff locker — nicht verkrampfen.`,move:`Entspannt hängen. Schultern aktiv nach unten ziehen — nicht hochziehen lassen. Fingergelenke spüren.`,cue:`Bringt Blut in Fingersehne und Unterarme ohne Belastung. Sehne hat keine eigene Blutversorgung — Aufwärmen ist entscheidend. Mindestens 5–10 Min vor schwerem Fingertraining.`},w5:{start:`Bauchlage, Hände unter den Schultern.`,move:`10 normale Liegestütze, kein Maximum.`,cue:`Schulter und Brust aufwärmen. Langsam und bewusst.`},cd1:{start:`Stehend oder sitzend, Arm gestreckt vor dir.`,move:`Handfläche nach oben: anderer Hand drückt Finger sanft nach unten. Dann Handfläche nach unten.`,cue:`Finger und Unterarm dehnen. Je 60 Sek pro Seite.`},cd2:{start:`Stehend, Arm quer über die Brust gestreckt.`,move:`Anderer Arm drückt den gestreckten Arm sanft zur Brust.`,cue:`Hintere Schulter dehnen. Nicht reißen. 45 Sek halten.`},cd3:{start:`Tiefer Ausfallschritt, hinteres Knie auf dem Boden.`,move:`Hüfte langsam nach vorne und unten drücken. Oberkörper aufrecht.`,cue:`Hüftbeuger und Leiste dehnen. Wichtig nach Kniebeugen.`},cd4:{start:`Seitlich sitzen, Beine angewinkelt, Hände auf dem Boden.`,move:`Oberkörper rotieren, Arm führt die Bewegung. Links und rechts wechseln.`,cue:`Brustwirbelsäule mobilisieren. Langsam. Nach jedem Training wichtig.`},hanging_knee:{start:`An der Klimmzugstange hängen, Arme gestreckt, Schultern aktiv.`,move:`Knie kontrolliert zur Brust ziehen. Langsam wieder strecken.`,cue:`Kein Schwung — reine Bauchkraft. Schultern nicht hochziehen. Einstieg vor Toes-to-Bar.`},dragon_flag:{start:`Rückenlage, Hände greifen die Bank oder Stangen hinter dem Kopf.`,move:`Körper gestreckt hochheben bis fast senkrecht, dann langsam absenken bis knapp über der Bank.`,cue:`Nur die Schultern haben Kontakt. Körper bleibt die ganze Zeit gerade wie ein Brett. Beginne mit angewinkelten Beinen.`},arch_body:{start:`Bauchlage, Arme nach vorne gestreckt.`,move:`Arme und Beine gleichzeitig abheben. Körperbogen halten. Absenken.`,cue:`Gegenstück zum Hollow Body. Wichtig für Gleichgewicht der Rumpfmuskulatur. Blick bleibt nach unten.`},inverted_row:{start:`Stange auf Brusthöhe, Körper darunter, Fersen am Boden, Körper gerade.`,move:`Brust zur Stange ziehen. Schulterblätter am Ende zusammen. Kontrolliert absenken.`,cue:`Körper bleibt gerade wie ein Brett — kein Hohlkreuz. Schwierigkeit durch Winkel regulieren.`},scap_pulldown:{start:`An der Latzugmaschine sitzen, weiter Griff.`,move:`Nur Schulterblätter nach unten ziehen — Arme bleiben fast gestreckt. Kurz halten. Lösen.`,cue:`Minimale Bewegung, maximale Schulter-Aktivierung. Ideal als Aufwärm- und Aktivierungsübung.`},facepull_band:{start:`Band auf Augenhöhe befestigt. Beide Enden greifen.`,move:`Hände zur Stirn ziehen, Ellbogen hoch und seitlich. Kurz halten. Kontrolliert zurück.`,cue:`Rotatorenmanschette und hintere Schulter. Täglich ausführbar. Impingement-Prävention. Leichtes Band.`},lateral_raise:{start:`Stehend, KB in jeder Hand, Arme am Körper.`,move:`Arme seitlich bis Schulterhöhe heben. Daumen leicht nach unten. Kontrolliert senken.`,cue:`Schulter-Isolation. Nicht schwingen. Arme leicht gebeugt. Keine Überkopfbewegung nötig.`},w_activation:{start:`Vierfüßlerstand, Hände unter Schultern, Knie unter Hüfte.`,move:`Ein Bein seitlich anheben bis Hüfthöhe. Halten. Absenken. Seite wechseln.`,cue:`Gluteus medius aktivieren. Wichtig für Hüftstabilität beim Klettern. Becken bleibt gerade.`},sldl:{start:`Einbeinig stehend, KB in der Hand der Standbeinseite.`,move:`Oberkörper nach vorne neigen, freies Bein hebt hinten an. Zurück zur Ausgangsposition.`,cue:`Standbein leicht gebeugt. Rücken gerade. Langsam und kontrolliert. Gleichgewicht trainieren.`},stepup:{start:`Stabiler Kasten oder Bank vor dir. KB in beiden Händen.`,move:`Fuß komplett auf die Erhöhung setzen. Körper hochdrücken. Hüfte oben strecken. Kontrolliert absteigen.`,cue:`Drücke durch die Ferse. Oberkörper aufrecht. Knie bleibt über dem Fuß. Unilateral sehr effektiv.`},pullups_ug:{start:`Untergriff an der Stange, Hände schulterbreit.`,move:`Körper hochziehen bis Kinn über die Stange. Vollständig strecken.`,cue:`Untergriff aktiviert den Bizeps stärker als Obergriff. Volle Streckung unten für maximalen Reiz.`},pullups_exp:{start:`An der Klimmzugstange hängen, Schulterbreiter Griff.`,move:`So explosiv wie möglich hochziehen. Hände lösen kurz am höchsten Punkt. Kontrolliert absenken.`,cue:`Die Ausführungsgeschwindigkeit ist der Trainingsreiz — nicht das Gewicht. Vollständige Pause zwischen Sätzen für maximale RFD.`},kbswing_exp:{start:`KB vor den Füßen, Hüfte gebeugt, Rücken gerade.`,move:`Aus der Hüfte explosiv strecken — maximale Geschwindigkeit. KB schwingt bis Schulterhöhe.`,cue:`Maximale Hüft-Explosivität. Arme passiv. Am höchsten Punkt kurz standfest. Power kommt aus Gesäß und Hüfte.`},pushpress_exp:{start:`Langhantel oder KB auf den Schultern.`,move:`Leichter Kniebeugeschub als Anlauf. Dann explosiv pressen bis Arme gestreckt.`,cue:`60% 1RM. Pressphase maximal explosiv. Bremsphase kontrolliert. RFD — nicht das Gewicht ist der Reiz.`},ab_wheel:{start:`Knie auf dem Boden, Hände am Ab-Wheel schulterbreit.`,move:`Wheel langsam nach vorne ausrollen bis Rücken gerade gestreckt ist. Bauch zieht es zurück.`,cue:`Nur so weit rollen wie der Rücken gerade bleibt. Fortgeschritten: gestreckte Beine. Sehr effektiv für Rumpfkraft.`},toes_bar:{start:`An der Klimmzugstange hängen, Arme gestreckt, Schultern aktiv.`,move:`Gestreckte Beine zur Stange führen. Kontrolliert absenken.`,cue:`Kein Schwung. Hüftbeuger und Core kombiniert. Direkt anwendbar beim Klettern im Überhang.`},deanhang:{start:`An der 20mm Hangboard-Leiste hängen, 4-Finger Half-Crimp. Benchmark-Test am Hangboard — nicht an der Lifting Edge.`,move:`Hängen bis zum absoluten Versagen. Schultern aktiv — nicht einsinken lassen. Zeit stoppen.`,cue:`BENCHMARK am Hangboard: absolutes Maximum, einmalig. Vollständig aufgewärmt. NIE bei Schmerzen. Sehne braucht 48h Erholung. Unterschied zur Lifting Edge: hier wird gehangen, nicht gehoben.`},hang_weight:{start:`Lifting Edge (20mm Leiste) liegt am Boden. Gewichtsscheiben liegen auf der Leiste. Stehend davor, 4-Finger Half-Crimp an der Leiste.`,move:`Leiste mit den Fingern greifen und Gewichtsscheiben vom Boden abheben — wie ein Finger-Deadlift. Einmal, sauber.`,cue:`Reines 1RM — kein Halten nötig. Gewicht steigern bis zum Maximum. Analogie: Deadlift für Finger. Vollständig aufgewärmt. Nur Zusatzgewicht eintragen.`},pushups:{start:`Bauchlage, Hände etwas breiter als Schultern, Körper gerade.`,move:`Körper bis zur Brust senken. Hochdrücken. Körper bleibt gerade wie ein Brett.`,cue:`Hüfte nicht durchhängen. Core angespannt. Brust berührt fast den Boden. Ellbogen nicht zu weit abspreizen.`},pullups_weight:{start:`Klimmzugstange, Gewichtsgürtel anlegen, schulterbreiter Griff.`,move:`Wie Klimmzüge — Körper hochziehen bis Kinn über Stange. Vollständig strecken.`,cue:`Nur wenn Bodyweight-Klimmzüge sauber. Moderates Zusatzgewicht. Volle Streckung unten ist Pflicht.`},cd5:{start:`Stehend, eine Hand greift hoch an einen Türrahmen oder Barren.`,move:`Körper leicht von der Hand wegneigen. Latissimus dehnt sich. Seite wechseln.`,cue:`Sanft und kontrolliert. Lat-Dehnung nach Zugtraining wichtig. Je 45 Sek pro Seite.`},campus_ladder:{start:`Am Campus Board hängen, beide Hände auf gleicher Sprosse.`,move:`Abwechselnd eine Hand zur nächsten Sprosse ziehen — Leiter nach oben. Kontrolliert zurück.`,cue:`Maximale Explosivität pro Zug. Arme fast strecken unten. Nur mit vollständig aufgewärmten Sehnen. Kein Training bei Fingerschmerzen.`},campus_onetwo:{start:`Am Campus Board hängen, eine Hand auf Sprosse 1.`,move:`Explosiv zur Sprosse 2, dann 3. Zurück. Seite wechseln.`,cue:`RFD-Training — die Ausführungsgeschwindigkeit ist der Reiz. 3 Min Pause zwischen Sätzen ist Pflicht. Niemals bei Schmerzen.`},wrist_ext:{start:`Sitzend, Unterarm liegt auf dem Oberschenkel, Handrücken zeigt nach oben. Leichte KB oder kein Gewicht.`,move:`Handgelenk heben (Extension) und senken. Kontrolliert. 15–20 Wiederholungen.`,cue:`PFLICHT nach jedem Training. Klettern ist extrem Flexoren-dominant — ohne Extensoren-Training droht Golfer's Elbow. Täglich ausführbar, täglich wichtig.`},finger_ext:{start:`Leichtes Gummiband um alle fünf Finger legen.`,move:`Finger gegen den Bandwiderstand spreizen. Kurz halten. Schließen. Wiederholen.`,cue:`Direktes Gegenstück zur Greifbewegung. Verhindert Dysbalance zwischen Finger-Flexoren (stark durch Klettern) und -Extensoren. Täglich nach Klettern oder Fingertraining.`},ring_row:{start:`Ringe oder TRX auf Brusthöhe einstellen. Darunter positionieren, Fersen am Boden, Körper gerade.`,move:`Brust zu den Ringen ziehen. Schulterblätter am Ende zusammen. Kontrolliert absenken.`,cue:`Schwierigkeit über Körperwinkel regulieren — je steiler, desto leichter. Körper bleibt gerade wie ein Brett.`},w_band:{start:`Leichtes Widerstandsband auf Brusthöhe befestigt.`,move:`Band mit beiden Händen greifen und auseinanderziehen bis zur Brust. Langsam zurück.`,cue:`Schulter-Antagonisten aktivieren. Leichtes Band. Rotatorenmanschette. Täglich möglich.`},w_row_light:{start:`Latzugmaschine oder Kabelzug, 50% des normalen Gewichts.`,move:`12 Wdh Rudern — saubere Form, langsame Bewegung.`,cue:`Bewegungsmuster einschleifen vor schwerem Zugtraining. Schulterblätter aktivieren. Kein Aufwärmen bis zur Erschöpfung.`},campus_ladder:{start:`Campus Board, beide Hände auf Leiste 1. Schultern aktiv, Körperspannung.`,move:`Rechte Hand zu Leiste 2, dann 3. Linke Hand folgt rückwärts: 2, 1. Kontrolliert absteigen.`,cue:`Klassischer Campus-Drill. Explosiv hoch, kontrolliert runter. Kein Schwingen. Volle Pause zwischen Sätzen — RFD Training.`},campus_135:{start:`Campus Board, beide Hände auf Leiste 1.`,move:`Beide Hände gleichzeitig zu Leiste 3 springen. Dann zu Leiste 5. Kontrolliert absteigen.`,cue:`Maximale Explosivität — das ist der Trainingsstimulus. Nur wenn 1-2-3 Ladder sauber. 4 Min Pause zwischen Sätzen.`},campus_lockoff:{start:`Campus Board, eine Hand auf Leiste, Ellbogen 90° gebeugt.`,move:`Position halten. Schultern aktiv runterziehen. Hand wechseln nach der Haltezeit.`,cue:`Isometrische Kraft für schwierige Züge beim Klettern. Kein Einsinken in die Schulter. Pro Seite.`},campus_match:{start:`Campus Board, eine Hand auf Leiste 1.`,move:`Andere Hand auf dieselbe Leiste bringen (match). Dann beide Hände zur nächsten Leiste.`,cue:`Koordination und Explosivität kombiniert. Qualität vor Geschwindigkeit.`},campus_typewriter:{start:`Campus Board, beide Hände auf gleicher Leiste oben.`,move:`Eine Hand loslassen und seitlich zur Nachbar-Leiste bewegen. Zurück. Seite wechseln.`,cue:`Laterale Kraft und Schulter-Stabilität. Kontrollierte Bewegung — kein Reißen.`},spray1:{start:`An der Kletterwand, Schuhe an, Chalk bereit.`,move:`Routen frei wählen und klettern.`,cue:`Eigene Sequenzen oder vorgegebene Markierungen folgen. Qualität vor Quantität bei Projektzügen.`}},ae=[{id:`maxhang`,name:`Max Hang`,desc:`10 Sek hängen · 3 Min Pause · maximale Last`,hangSec:10,restSec:180,sets:6,science:`Maximalkraft-Training für Fingersehne. 85–95% Intensität. Vollständige Pause ist Pflicht.`},{id:`rep73`,name:`Repeater 7/3`,desc:`7 Sek / 3 Sek · 6× pro Satz · 3 Min Pause`,hangSec:7,restSec:3,repsPerSet:6,setRestSec:180,sets:4,science:`Kraft-Ausdauer nach Eva López. Ca. 60–70% Intensität. Erhöht die Blutversorgung im Sehne.`},{id:`rep64`,name:`Repeater 6/4`,desc:`6 Sek / 4 Sek · 6× pro Satz · 3 Min Pause`,hangSec:6,restSec:4,repsPerSet:6,setRestSec:180,sets:4,science:`Milderes Repeater-Protokoll. Gut für Aufbau oder nach Pause.`},{id:`density`,name:`Density Hangs`,desc:`Alle 60 Sek ein Hang · 10 Sätze`,hangSec:10,restSec:50,sets:10,science:`Hohes Volumen bei moderater Intensität. Sehnen-Konditionierung.`},{id:`abrahangs`,name:`Abrahangs`,desc:`~40% max · Füße am Boden · täglich · 10 Min`,hangSec:10,restSec:50,sets:10,isAbrahangs:!0,science:`Gilmore et al. 2024 (Sports Medicine Open): Abrahangs gleich effektiv wie Max Hangs beim Kraftaufbau. Kombination beider = additive Gewinne. Füße bleiben am Boden (~40% max). Mindestens 6h Pause zwischen Sessions. Sehnen-Adaptation durch Kollagen-Synthese (Baar 2017).`},{id:`cf_test`,name:`Critical Force Test`,desc:`6 Sek / 4 Sek · 18 Wdh · 3 Min am Stück · deine Ausdauerkraft messen`,hangSec:6,restSec:4,repsPerSet:18,setRestSec:0,sets:1,science:`Critical Force (CF) ist die maximale Last die du 3 Minuten lang halten kannst — die Grenze zwischen aerobem und anaerobem Bereich. Liegt typisch bei 45–55% deines Max Hangs.

So läuft der Test:
1. Wähle ein Zusatzgewicht (oder negativ für Assisted)
2. Hänge 18× 6s/4s nonstop durch
3. Schaffst du alle 18 Wdh? → nächstes Mal Last erhöhen
4. Schaffst du es nicht? → Last reduzieren

Block-Struktur:
Woche 1 — Aufbau I: Density Hangs (~40% max), hohes Volumen, moderate Intensität. Ziel: Sehnen-Konditionierung und Blutfluss.
Woche 2 — Aufbau II: Max Hang (~80% max), maximale Intensität. Ziel: Maximalkraft.
Woche 3 — Aufbau III: Repeater 7/3 (~60% max), Kraft-Ausdauer. Ziel: Critical Force.
Woche 4 — Deload: Reduziertes Volumen (60%), leichte Protokolle. Ziel: Supercompensation.

Warum Deload? Adaptation findet nicht während, sondern nach dem Training statt — in der Erholungsphase. Ohne Deload kumuliert Ermüdung und überdeckt Kraftgewinne. Studien zeigen, dass 1 Woche Deload nach 3 Wochen Intensivtraining zu messbaren Leistungssprüngen führt.

Die Periodisierung wird automatisch aus deiner Trainingshistorie berechnet — anhand der Anzahl aktiver Trainingswochen seit Beginn.`},{title:`Leistungstest & Wirkung`,color:C.accent,icon:`▲`,content:`Der Leistungstest ist keine Einmessung — er ist das Steuerungselement der gesamten Trainingsplanung.

Bankdrücken & Kniebeuge 1RM → Gewichtsempfehlungen
Alle Gewichtsangaben im Training werden direkt aus deinen 1RM-Werten berechnet. Kraft-Fokus = 82% 1RM, Ausdauer = 58%, Power = 65%. Ohne Benchmark: unscharfe Schätzwerte.

Klimmzüge → Wiederholungszahl
Deine Klimmzug-Max bestimmt direkt die empfohlenen Wdh. Bei 12 Max-Klimmzügen im Kraft-Block: 10 Wdh (82%).

Lifting Edge Max Pull → Fingertrainingsgewicht
Max Hang = 80% deines Max Pull. Repeater = 60%. Density = 40%. Diese Verhältnisse entsprechen den Intensitätszonen nach Lattice Training.

Dead Hang & Critical Force → Benchmarking
Diese Werte dienen primär der Entwicklungsverfolgung. Ein steigender Critical Force Wert zeigt verbesserte aerobe Kapazität der Fingermuskulatur — relevant ab Fortgeschrittenem Niveau.

Empfehlung: Leistungstest alle 4–6 Wochen, idealerweise nach der Deload-Woche wenn du am frischesten bist.`},{title:`Wissenschaftliche Basis`,color:`#a78bfa`,icon:`◉`,content:`Die App basiert auf peer-reviewed Forschung und Lattice Training Daten (2025).

Fingerkraft — primärer Leistungsprädiktor
Lattice 2025 (n=901): Fingerkraft ist der stärkste Einzelprädiktor für Kletterperformance. Bei Einsteigern dominant, bei Elite-Athleten steigt die Bedeutung von Critical Force und Kraftausdauer.

Fingerprotokoll-Effektivität (Hermans et al. 2022)
10 Wochen Hangboard: +17–28% Maximalkraft. Kein signifikanter RFD-Effekt. Fazit: Hangboard baut Maximalkraft zuverlässig, aber nicht Explosivkraft.

Abrahangs (Gilmore et al. 2024, Sports Medicine Open)
Niedrig-intensive Hangs (~40% max) sind genauso effektiv wie Max Hangs beim Kraftaufbau. Kombination beider = additive Gewinne (d=0.79 vs. d=0.29/0.45 einzeln). Täglich durchführbar durch geringe mechanische Belastung.

Pull:Push 2:1 (Lattice / Antagonisten-Forschung)
Klettern ist extrem zugdominant. Übermäßig entwickelte Lats destabilisieren das Schultergelenk. Pull:Push 2:1 im Krafttraining schützt die Rotatorenmanschette langfristig.

Handgelenksextensoren (Verletzungsepidemiologie)
50–82% aller Kletterer erleiden jährlich Verletzungen. Extensoren-Flexoren-Imbalance ist eine Hauptursache für mediale Epicondylitis (Golfer's Elbow). Tägliches Extensoren-Training nach dem Klettern ist evidenzbasierte Prävention.

BFR-Training (Limberg et al. 2019)
30% max mit Blutflussrestriktion = ähnliche Outcomes wie 60% ohne BFR. Interessant für Verletzungsphasen — aktuell nicht implementiert.`},{title:`Warm-up Philosophie`,color:`#34d399`,icon:`◎`,content:`Das Warm-up in dieser App ist fokus-spezifisch — nicht generisch.

Grundprinzip: Sehne hat keine eigene Blutversorgung. Blutfluss entsteht nur durch Bewegung. Mindestens 10–15 Minuten aktives Aufwärmen vor schwerem Fingertraining sind keine Option, sondern Pflicht.

Kraft-Fokus: Scapular Pulls → Goblet → Rudern leicht → Dead Hang
Aktiviert Schulterblatt-Depressoren, öffnet Hüfte, schleift Zugmuster ein.

Ausdauer-Fokus: + Band Pull-Apart statt Rudern
Schulter-Antagonisten vor Volumentraining.

Power-Fokus: + Hüft-Aktivierung
Vorbereitung auf explosive Hüftbewegung ohne Sprungbelastung.

Scapular Pulls sind Pflicht vor jedem Fingertraining: Serratus anterior und Schulterblatt-Depressoren stabilisieren den Schulter-Komplex beim Hängen. Ohne Aktivierung erhöht sich das Impingement-Risiko signifikant.`},{title:`Über diese App`,color:C.accent2,icon:`★`,content:`Stone Masters — entwickelt für ein spezifisches Home Gym.
